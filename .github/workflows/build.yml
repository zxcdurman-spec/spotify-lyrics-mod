name: Build mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: "26.3"
            fabric: "0.161.0+26.3"
          - mc: "26.2"
            fabric: "0.161.0+26.2"
    steps:
      - name: Unpack mod source
        run: echo "" | base64 -d | tar xJ

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build for Minecraft ${{ matrix.mc }}
        run: |
          set -o pipefail
          gradle build -Pminecraft_version=${{ matrix.mc }} -Pminecraft_dep=~${{ matrix.mc }} -Pfabric_version=${{ matrix.fabric }} 2>&1 | tee build.log

      - name: Error report
        if: failure()
        run: |
          echo "### Build errors (${{ matrix.mc }})" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E -A4 "error:|What went wrong|Could not" build.log | head -120 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - run: rm -f build/libs/*-sources.jar

      - uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.mc }}
          path: build/libs/*.jar

  release:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: jars
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Spotify Lyrics (build ${{ github.run_number }})
          files: jars/*.jar
          fail_on_unmatched_files: false
